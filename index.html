<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Ayush Roy — Graphic & Communication Design student creating concept-driven visuals."
    />
    <title>Ayush Roy</title>
    <link rel="icon" href="assets/images/profile/ayush.jpg" />
    <link rel="stylesheet" href="css/site.css" />
    <script src="js/site.js" defer></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
    <header class="topline">
      <a href="index.html">Ayush Roy</a
      ><span class="top-role">Graphic & Communication Design</span>
      <div class="top-right"></div>
    </header>
    <main class="home">
      <h1 class="hero-name">Ayush Roy</h1>
      <div class="tile-grid">
        <a class="tile about-tile" href="pages/about.html"
          ><span class="tile-label">About</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile portfolio-tile" href="pages/portfolio.html"
          ><span class="tile-label">Portfolio</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile contact-tile" href="pages/contact.html"
          ><span class="tile-label">Contact</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span
        ></a>
        <div class="tile portrait-tile" aria-label="Ayush Roy profile picture">
          <img src="assets/images/profile/ayush.jpg" alt="Ayush Roy" />
        </div>
        <a class="tile tools-tile" href="pages/skills.html"
          ><div class="tool-icons">
            <span class="tool-icon ue">Ps</span
            ><span class="tool-icon unity">Ai</span
            ><span class="tool-icon code">Id</span
            ><span class="tool-icon pixel">Ae</span>
          </div>
          <span class="tile-label">Tools & Skills</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile resume-tile" href="pages/resume.html"
          ><span class="tile-label">Resume</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span
        ></a>
      </div>
      <p class="home-note">
        CONCEPT-DRIVEN VISUALS WITH A PLAYFUL EDGE · GRAPHIC DESIGN PORTFOLIO
      </p>
    </main>
    <footer class="footer">
      <span>AYUSH ROY · DESIGN PORTFOLIO</span
      ><span>© <span id="year">2026</span> AYUSH ROY</span
      ><a href="pages/contact.html"
        >CONTACT
        <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon
      ></a>
    </footer>
  </body>
</html>
